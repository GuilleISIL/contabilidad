server.port=8080

spring.application.name=sofya

spring.datasource.url=jdbc:h2:mem:acctdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=true
spring.h2.console.path=/h2

# Activa hilos virtuales (Java 21) para mejorar concurrencia (opcional)
spring.threads.virtual.enabled=true

# Opcional: personalizar rutas de Swagger UI y OpenAPI
# (Si las defines, recuerda la nueva URL)
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs



